[package]
name = "bot"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "^1.0.94"
aws-config = { version = "1.1.7", features = ["behavior-version-latest"] }
aws-sdk-s3 = "1.59.0"
bytes = "1.7.2"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10.0"
dashmap = "6.1.0"
dotenvy = "0.15.7"
fancy-regex = "0.13.0"
futures = "0.3.30"
lazy_static = "1.4.0"
phf = { version = "0.11.2", features = ["macros"] }
poise = "0.6.1"
poise_macros = "0.6.1"
ppq_imageproc = { path = "../../packages/ppq_imageproc" }
rand = "0.8.5"
reqwest = { version = "0.12.4", features = ["json"] }
sdk = { path = "../../packages/sdk" }
serde = { version = "1.0.203", features = ["derive"] }
serde_json = { version = "1.0.117", features = ["std", "raw_value"] }
tokio = { version = "~1.43.0", features = ["macros", "rt-multi-thread"] }
url = "2.5.4"
urlencoding = "2.1.3"

